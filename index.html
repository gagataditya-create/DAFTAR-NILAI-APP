        (function () {
            function showFatalError(error) {
                const root = document.getElementById('root');
                if (!root) return;

                const message = error && error.message ? error.message : String(error || 'Terjadi kesalahan yang tidak diketahui.');
                root.innerHTML = `
                    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#020617 0%,#111827 100%);color:#fff;font-family:Arial,Helvetica,sans-serif;">
                        <div style="max-width:520px;width:100%;background:rgba(15,23,42,0.92);border:1px solid rgba(148,163,184,0.18);border-radius:24px;padding:28px;box-shadow:0 24px 60px rgba(15,23,42,0.45);">
                            <p style="text-transform:uppercase;letter-spacing:0.25em;font-size:12px;color:#818cf8;font-weight:700;margin:0 0 8px;">Sistem Penilaian</p>
                            <h2 style="margin:0 0 10px;font-size:24px;line-height:1.2;">Aplikasi gagal dimuat</h2>
                            <p style="margin:0 0 14px;color:#cbd5e1;font-size:14px;line-height:1.5;">Halaman ini tidak boleh blank. Silakan cek console browser untuk detailnya.</p>
                            <pre style="margin:0;padding:14px;border-radius:14px;background:#111827;border:1px solid rgba(99,102,241,0.25);color:#f8fafc;font-size:12px;white-space:pre-wrap;word-break:break-word;">${message}</pre>
                            <p style="margin-top:14px;font-size:12px;color:#94a3b8;">Jika masalah berlanjut, coba refresh halaman atau cek koneksi ke CDN eksternal.</p>
                        </div>
                    </div>
                `;
            }

            window.__showFatalError = showFatalError;

            window.addEventListener('error', (event) => {
                const error = event.error || new Error(event.message || 'Runtime error');
                showFatalError(error);
            });

            window.addEventListener('unhandledrejection', (event) => {
                const error = event.reason instanceof Error ? event.reason : new Error(String(event.reason || 'Unhandled promise rejection'));
                showFatalError(error);
            });
        })();
    </script>

        // --- ADAPTOR DATA LOKAL (OFFLINE) ---
        const db = {};
        const LOCAL_STORAGE_KEY = 'seru_local_app_data_v1';
        const KKM_STORAGE_PREFIX = 'seru_kkm_v1_';
        const getTeacherKkm = (teacherId) => {

        };
        const SUPABASE_URL = 'https://qtnmvphffxfnwgbkhtwh.supabase.co';
        const activeApiKey = 'sb_publishable_bbxwugdf_CR019mf5VUUAg_3aGuM8Oj';
        const SUPABASE_ANON_KEY = activeApiKey;

        const createSupabaseClient = () => {
            try {
                if (!window.supabase || typeof window.supabase.createClient !== 'function') return null;

        const supabase = createSupabaseClient();
        let LOCAL_DATA = { classes: [], students: [], assessments: [], grades: {}, teacher_classes: [] };
        let dataListeners = [];

        const notifyListeners = () => dataListeners.forEach(fn => fn(LOCAL_DATA));
        const generateId = () => Math.random().toString(36).substr(2, 9);

        const loadLocalData = () => {
            try {
                const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    return {
                        classes: Array.isArray(parsed.classes) ? parsed.classes : [],
                        students: Array.isArray(parsed.students) ? parsed.students : [],
                        assessments: Array.isArray(parsed.assessments) ? parsed.assessments : [],
                        grades: parsed.grades && typeof parsed.grades === 'object' ? parsed.grades : {}
                    };
                }
            } catch (e) {
                console.warn('Gagal membaca data lokal:', e);
            }
            return { classes: [], students: [], assessments: [], grades: {}, teacher_classes: [] };
        };

        const saveLocalData = (state) => {
            try {
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                console.warn('Gagal menyimpan data lokal:', e);
            }
        };

        const initDb = async () => {
            LOCAL_DATA = loadLocalData();
            notifyListeners();
            return true;
        };

        const collection = (db, name) => name;
        const doc = (db, col, id) => ({ col, id });
        const query = (col, ...args) => col;
        const orderBy = (field) => field;

        const toCamelCase = (key) => key.replace(/_([a-z])/g, (_, c) => c.toUpperCase());
        const toSnakeCase = (key) => key.replace(/([A-Z])/g, '_$1').toLowerCase();

        const normalizeRow = (row) => {
            const normalized = Object.fromEntries(
                Object.entries(row || {}).map(([key, value]) => [toCamelCase(key), value])
            );

            if (normalized.passwordHash === undefined && normalized.password_hash !== undefined) normalized.passwordHash = normalized.password_hash;
            if (normalized.isAdmin === undefined && normalized.is_admin !== undefined) normalized.isAdmin = normalized.is_admin;
            if (normalized.themeFrom === undefined && normalized.theme_from !== undefined) normalized.themeFrom = normalized.theme_from;
            if (normalized.themeTo === undefined && normalized.theme_to !== undefined) normalized.themeTo = normalized.theme_to;
            if (normalized.passwordHash === undefined && normalized.password_hash !== undefined) normalized.passwordHash = normalized.password_hash;
            if (normalized.isAdmin === undefined && normalized.is_admin !== undefined) normalized.isAdmin = normalized.is_admin;
            if (normalized.themeFrom === undefined && normalized.theme_from !== undefined) normalized.themeFrom = normalized.theme_from;
            if (normalized.themeTo === undefined && normalized.theme_to !== undefined) normalized.themeTo = normalized.theme_to;
            if (normalized.className === undefined && normalized.class_name !== undefined) normalized.className = normalized.class_name;
            if (normalized.studentName === undefined && normalized.student_name !== undefined) normalized.studentName = normalized.student_name;
            if (normalized.classId === undefined && normalized.class_id !== undefined) normalized.classId = normalized.class_id;
            if (normalized.studentId === undefined && normalized.student_id !== undefined) normalized.studentId = normalized.student_id;
            if (normalized.assessmentId === undefined && normalized.assessment_id !== undefined) normalized.assessmentId = normalized.assessment_id;
            if (normalized.teacherId === undefined && normalized.teacher_id !== undefined) normalized.teacherId = normalized.teacher_id;
            if (normalized.subjectId === undefined && normalized.subject_id !== undefined) normalized.subjectId = normalized.subject_id;
            if (normalized.assessmentType === undefined && normalized.assessment_type !== undefined) normalized.assessmentType = normalized.assessment_type;
            if (normalized.maxScore === undefined && normalized.max_score !== undefined) normalized.maxScore = normalized.max_score;
            if (normalized.createdAt === undefined && normalized.created_at !== undefined) normalized.createdAt = normalized.created_at;
            if (normalized.updatedAt === undefined && normalized.updated_at !== undefined) normalized.updatedAt = normalized.updated_at;
            if (normalized.title === undefined && normalized.assessment_title !== undefined) normalized.title = normalized.assessment_title;
            if (normalized.name === undefined && normalized.className !== undefined) normalized.name = normalized.className;
            if (normalized.name === undefined && normalized.studentName !== undefined) normalized.name = normalized.studentName;

            return normalized;
        };

        const normalizePayload = (payload, tableName) => {
            const normalized = Object.fromEntries(
                Object.entries(payload || {}).map(([key, value]) => [toSnakeCase(key), value])
            );

            if (tableName === 'classes' && Object.prototype.hasOwnProperty.call(payload, 'name')) {
                normalized.class_name = normalized.name;
                delete normalized.name;
            }
            if (tableName === 'students' && Object.prototype.hasOwnProperty.call(payload, 'name')) {
                normalized.student_name = normalized.name;
                delete normalized.name;
            }
            if (tableName === 'students' && Object.prototype.hasOwnProperty.call(payload, 'classId')) {
                normalized.class_id = normalized.class_id ?? normalized.classid;
                delete normalized.classid;
            }
            if (tableName === 'assessments' && Object.prototype.hasOwnProperty.call(payload, 'maxScore')) {
                normalized.max_score = normalized.max_score ?? normalized.maxscore;
                delete normalized.maxscore;
            }

            return normalized;
        };

        const sha256Hex = async (input) => {
            const bytes = new TextEncoder().encode(input);
            const digest = await crypto.subtle.digest('SHA-256', bytes);
            return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
        };

        const verifyTeacherPassword = async (profile, password) => {
            if (!profile) return false;
            
            // Pengecekan Khusus untuk Admin (Pak Gagat)
            if (profile.id === 'gagat') {
                return password === 'monalisa';
            }
            
            // Pengecekan untuk guru lainnya
            return password === 'guru123';
        };

        const fetchSupabaseData = async (tableName) => {
            if (!supabase) return [];
            try {
                const { data, error } = await supabase.from(tableName).select('*');
                if (error) {
                    console.warn('Supabase fetch failed for', tableName, error);
                    return [];
                }
                return (data || []).map(row => normalizeRow(row));
            } catch (e) {
                console.warn('Supabase fetch threw for', tableName, e);
                return [];
            }
        };

        const syncSupabaseRecord = async (tableName, record, mode = 'upsert') => {
            if (!supabase) return null;
            const payload = normalizePayload(record, tableName);
            if (mode === 'delete') {
                return supabase.from(tableName).delete().eq('id', record.id);
            }
            if (mode === 'update' && record.id) {
                return supabase.from(tableName).update(payload).eq('id', record.id);
            }
            return supabase.from(tableName).upsert([payload]).select('*').single();
        };

        const onSnapshot = (col, callback) => {
            const tableName = typeof col === 'string' ? col : col.table || col;
            const listener = async (state) => {
                if (tableName === 'grades') {
                    const docs = Object.entries(state.grades || {}).map(([id, score]) => {
                        const [studentId, assessmentId] = id.split('_');
                        return { data: () => ({ studentId, assessmentId, score }) };
                    });
                    callback({ docs });
                    return;
                }

                const supabaseData = await fetchSupabaseData(tableName);
                if (supabaseData && supabaseData.length >= 0) {
                    const docs = supabaseData.map(item => ({ id: item.id, data: () => item }));
                    callback({ docs });
                    return;
                }

                const docs = (state[tableName] || []).map(item => ({ id: item.id, data: () => item }));
                callback({ docs });
            };

            dataListeners.push(listener);
            listener(LOCAL_DATA);

            if (supabase) {
                try {
                    const channel = supabase.channel(`sync:${tableName}`);
                    channel.on('postgres_changes', { event: '*', schema: 'public', table: tableName }, () => {
                        listener(LOCAL_DATA);
                    });
                    channel.subscribe();
                    return () => {
                        dataListeners = dataListeners.filter(l => l !== listener);
                        supabase.removeChannel(channel);
                    };
                } catch (e) {
                    console.warn('Realtime subscribe failed for', tableName, e);
                }
            }

            return () => { dataListeners = dataListeners.filter(l => l !== listener); };
        };

        const getTeacherProfiles = async () => {
            const fallback = FALLBACK_TEACHER_PROFILES;
            if (!supabase) return fallback;

            try {
                const rows = await fetchSupabaseData('teachers');
                if (!Array.isArray(rows) || rows.length === 0) return fallback;

                const merged = {}; // Mengunci hanya data asli dari Supabase yang dimuat
                rows.forEach(row => {
                    const profile = {
                        id: row.id || row.username || row.name,
                        name: row.name || row.username || 'Guru',
                        subject: row.subject || 'Umum',
                        password: '',
                        passwordHash: row.passwordHash || null,
                        isAdmin: Boolean(row.isAdmin),
                        icon: row.icon ? row.icon : fallback[row.id]?.icon || fallback.gagat.icon,
                        themeFrom: row.themeFrom || fallback[row.id]?.themeFrom || 'from-indigo-600',
                        themeTo: row.themeTo || fallback[row.id]?.themeTo || 'to-purple-600',
                        defaultApiUrl: fallback[row.id]?.defaultApiUrl || fallback.gagat.defaultApiUrl,
                    };
                    merged[profile.id] = profile;
                });
                return merged;
            } catch (e) {
                console.warn('Gagal memuat guru dari Supabase:', e);
                return fallback;
            }
        };

        const apiPost = async () => {};

        const addDoc = async (col, data) => {
            let id = generateId();
            if (data._customId) {
                id = data._customId;
                delete data._customId;
            }
            const newItem = { id, ...data };
            LOCAL_DATA[col] = [...(LOCAL_DATA[col] || []), newItem];
            saveLocalData(LOCAL_DATA);
            notifyListeners();
            await syncSupabaseRecord(col, newItem, 'upsert').catch(() => {});
            await apiPost({ action: 'create', table: col, data: newItem });
            return { id };
        }

        const updateDoc = async (docRef, data) => {
            const col = docRef.col;
            LOCAL_DATA[col] = LOCAL_DATA[col].map(item => item.id === docRef.id ? { ...item, ...data } : item);
            saveLocalData(LOCAL_DATA);
            notifyListeners();
            await syncSupabaseRecord(col, { id: docRef.id, ...data }, 'update').catch(() => {});
            await apiPost({ action: 'update', table: col, data: { id: docRef.id, ...data } });
        }

        const deleteDoc = async (docRef) => {
            if (docRef.col === 'grades') {
                const id = docRef.id;
                delete LOCAL_DATA.grades[id];
                saveLocalData(LOCAL_DATA);
                await syncSupabaseRecord('grades', { id }, 'delete').catch(() => {});
                await apiPost({ action: 'deleteGrade', table: 'grades', data: { id } });
            } else {
                LOCAL_DATA[docRef.col] = LOCAL_DATA[docRef.col].filter(item => item.id !== docRef.id);
                saveLocalData(LOCAL_DATA);
                await syncSupabaseRecord(docRef.col, { id: docRef.id }, 'delete').catch(() => {});
                await apiPost({ action: 'delete', table: docRef.col, data: { id: docRef.id } });
            }
            notifyListeners();
        }

        const setDoc = async (docRef, data, options) => {
             if(docRef.col === 'grades') {
                 const id = docRef.id;
                 LOCAL_DATA.grades[id] = data.score;
                 saveLocalData(LOCAL_DATA);
                 notifyListeners();
                 await syncSupabaseRecord('grades', { id, studentId: data.studentId, assessmentId: data.assessmentId, score: data.score, updatedAt: data.updatedAt }, 'upsert').catch(() => {});
                 await apiPost({ action: 'setGrade', table: 'grades', data: { id, studentId: data.studentId, assessmentId: data.assessmentId, score: data.score, updatedAt: data.updatedAt } });
             }
        }

        // --- MAIN COMPONENT ---
        function ArtGradesApp() {
            const [authUser, setAuthUser] = useState(null);
            const [teacherProfiles, setTeacherProfiles] = useState(FALLBACK_TEACHER_PROFILES);
            
            // Login States
            const [selectedTeacherId, setSelectedTeacherId] = useState('gagat');
            const [passInput, setPassInput] = useState('');
            
            const [loginError, setLoginError] = useState(false);
            const [isCheckingLogin, setIsCheckingLogin] = useState(false);

            const [activeTab, setActiveTab] = useState('dashboard');
            const [data, setData] = useState({ classes: [], students: [], assessments: [], grades: {}, teacher_classes: [] });
            
            const [dialogState, setDialogState] = useState({ isOpen: false, config: {} });

            const showMessage = (message, title = 'Pemberitahuan') => {
                setDialogState({ isOpen: true, config: { type: 'alert', title, message } });
            };

            const showConfirm = (message, onConfirm, title = 'Konfirmasi') => {
                globalDialogCallback = onConfirm;
                setDialogState({ isOpen: true, config: { type: 'confirm', title, message } });
            };

            const handleDialogClose = (result) => {
                setDialogState({ isOpen: false, config: {} });
                if (result && globalDialogCallback) {
                    globalDialogCallback();
                }
                globalDialogCallback = null;
            };

            useEffect(() => {
                const loadTeachers = async () => {
                    const profiles = await getTeacherProfiles();
                    setTeacherProfiles(profiles);
                };
                loadTeachers();

                const savedSessionId = localStorage.getItem('seru_active_session_id');
                if (savedSessionId && teacherProfiles[savedSessionId]) {
                    const profile = teacherProfiles[savedSessionId];
                    initDb().then(() => {
                        setAuthUser(profile);
                        setActiveTab(profile.isAdmin ? 'settings' : 'dashboard');
                    });
                    return;
                }
            }, []);

            useEffect(() => {
                if (!authUser) return;
                
                const unsubscribes = [
                    onSnapshot(query(collection(db, 'classes'), orderBy('name')), s => 
                        setData(p => ({ ...p, classes: s.docs.map(d => ({ id: d.id, ...d.data() })) }))),
                    onSnapshot(query(collection(db, 'students'), orderBy('name')), s => 
                        setData(p => ({ ...p, students: s.docs.map(d => ({ id: d.id, ...d.data() })) }))),
                    onSnapshot(query(collection(db, 'assessments'), orderBy('createdAt')), s => 
                        setData(p => ({ ...p, assessments: s.docs.map(d => ({ id: d.id, ...d.data() })) }))),
                    onSnapshot(query(collection(db, 'grades')), s => {
                        const map = {};
                        s.docs.forEach(d => { const dt = d.data(); map[`${dt.studentId}_${dt.assessmentId}`] = dt.score; });
                        setData(p => ({ ...p, grades: map }));
                    }),
                    onSnapshot(query(collection(db, 'teacher_classes')), s => 
                        setData(p => ({ ...p, teacher_classes: s.docs.map(d => ({ id: d.id, ...d.data() })) })))
                ];
                return () => unsubscribes.forEach(u => u());
            }, [authUser]);

            const handleLoginSubmit = async (event) => {
                event.preventDefault();
                const profiles = await getTeacherProfiles();
                setTeacherProfiles(profiles);
                const profile = profiles[selectedTeacherId];
                await handleLoginProcess(profile, passInput);
            };

            const handleLoginProcess = async (profile, password) => {
                const isValid = await verifyTeacherPassword(profile, password);
                if (profile && isValid) {
                    setIsCheckingLogin(true);
                    setLoginError(false);
                    
                    const success = await initDb();

        // --- DASHBOARD VIEW ---
        function DashboardView({ data, authUser, showMessage, activeClasses }) {
            const [pendingChanges, setPendingChanges] = useState({});
            const [isSaving, setIsSaving] = useState(false);
            
            // FILTER: Hanya hitung materi & nilai milik guru yang sedang login
            const myAssessments = useMemo(() => {
                return data.assessments.filter(a => {
                    const parts = a.id.split('-');
                    const aTeacherId = parts.length === 3 ? parts[1] : 'gagat';
                    return aTeacherId === authUser.id;
                });
            }, [data.assessments, authUser.id]);

            const myGradesCount = useMemo(() => {
                return Object.keys(data.grades).filter(key => {
                    const assId = key.split('_')[1];
                    return myAssessments.some(a => a.id === assId);
                }).length;
            }, [data.grades, myAssessments]);

            const standardClasses = [['9A','9B','9C','9D','9E'], ['8A','8B','8C','8D','8E'], ['7A','7B','7C','7D','7E']];
            
            const toggleClassManual = (name) => {
                const dbClass = data.classes.find(c => c.name === name);
                let dbStatus = false;
                if (dbClass) {
                    const relation = data.teacher_classes?.find(tc => tc.teacherId === authUser.id && tc.classId === dbClass.id);
                    dbStatus = relation ? relation.isActive : false;
                }
                const currentStatus = pendingChanges[name] !== undefined ? pendingChanges[name] : dbStatus;
                const newStatus = !currentStatus;

                if (newStatus === dbStatus) {
                    const next = { ...pendingChanges };
                    delete next[name];
                    setPendingChanges(next);
                } else {
                    setPendingChanges({ ...pendingChanges, [name]: newStatus });
                }
            };

            const saveClassesToDb = async () => {
                setIsSaving(true);
                // PENGAMAN: Jika laci memori browser kosong, paksa buat laci baru agar tidak error undefined
                if (!LOCAL_DATA.teacher_classes) {
                    LOCAL_DATA.teacher_classes = [];
                }
                try {
                    const promises = Object.entries(pendingChanges).map(async ([name, isActive]) => {
                        let target = data.classes.find(c => c.name === name);
                        if (!target) {
                            const newClassRef = await addDoc(collection(db, 'classes'), { name, isActive: true, createdAt: Date.now() });
                            target = { id: newClassRef.id, name };
                        }
                        
                        // 1. Eksekusi aman ke Supabase dengan aturan Kunci Ganda
                        if (supabase) {
                            await supabase.from('teacher_classes').upsert({
                                teacher_id: authUser.id,
                                class_id: target.id,
                                is_active: isActive
                            }, { onConflict: 'teacher_id,class_id' });
                        }
                        
                        // 2. Simpan paksa ke memori lokal agar layar langsung mengunci pilihan
                        const existingIdx = LOCAL_DATA.teacher_classes.findIndex(tc => tc.teacherId === authUser.id && tc.classId === target.id);
                        if (existingIdx >= 0) {
                            LOCAL_DATA.teacher_classes[existingIdx].isActive = isActive;
                        } else {
                            LOCAL_DATA.teacher_classes.push({ id: `${authUser.id}_${target.id}`, teacherId: authUser.id, classId: target.id, isActive: isActive });
                        }
                    });
                    
                    await Promise.all(promises);
                    saveLocalData(LOCAL_DATA);
                    notifyListeners(); // Paksa layar untuk refresh data terbaru
                    setPendingChanges({});
                    showMessage("Konfigurasi kelas personal berhasil disimpan!", "Sukses");
                } catch (e) { showMessage("Gagal menyimpan: " + e.message, "Error"); }
                setIsSaving(false);
            };

            const hasChanges = Object.keys(pendingChanges).length > 0;

            return (
                <div className="space-y-8 animate-in fade-in">
                    <div className="flex flex-col md:flex-row justify-between items-end gap-4 border-b border-white/5 pb-6">
                        <div>
                            <h2 className="text-3xl font-bold text-white tracking-tight">Dashboard Guru</h2>
                            <p className="text-slate-400 mt-1">Overview Statistik & Manajemen Kelas ({authUser.subject})</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                        {[
                        { l: 'Total Siswa', v: data.students.length, i: <Users />, color: 'from-blue-500 to-cyan-500' },
                        { l: 'Kelas Aktif', v: activeClasses.length, i: <LayoutGrid />, color: 'from-violet-500 to-purple-500' },
                        { l: 'Materi Ajar', v: myAssessments.length, i: <BookOpen />, color: 'from-orange-500 to-amber-500' },
                        { l: 'Data Masuk', v: myGradesCount, i: <TrendingUp />, color: 'from-emerald-500 to-green-500' }
                        ].map((s, i) => (
                        <div key={i} className="relative group p-6 rounded-2xl bg-slate-900/50 border border-white/5 backdrop-blur-sm overflow-hidden transition-all hover:border-white/20 hover:bg-slate-800/50">
                            <div className={`absolute top-0 right-0 p-32 opacity-10 bg-gradient-to-br ${s.color} blur-3xl -mr-16 -mt-16 group-hover:opacity-20 transition-opacity`}></div>
                            <div className="relative z-10 flex justify-between items-start">
                                <div>
                                    <p className="text-slate-400 text-xs font-bold uppercase tracking-wider mb-2">{s.l}</p>
                                    <p className="text-4xl font-black text-white">{s.v}</p>
                                </div>
                                <div className={`p-3 rounded-xl bg-gradient-to-br ${s.color} text-white shadow-lg`}>{s.i}</div>
                            </div>
                        </div>
                        ))}
                    </div>

                    <div className="bg-slate-900/60 border border-white/10 rounded-2xl p-8 backdrop-blur-md relative">
                        <div className="flex justify-between items-center mb-8">
                            <div className="flex gap-3 items-center">
                                <div className="p-2 bg-indigo-500/20 rounded-lg text-indigo-400"><Check size={24}/></div>
                                <div>
                                    <h3 className="font-bold text-white text-lg">Panel Kontrol Kelas (Personal)</h3>
                                    <p className="text-xs text-slate-400">Kelas yang dinyalakan di sini hanya berlaku untuk akun Anda sendiri.</p>
                                </div>
                            </div>
                            {hasChanges && (
                                <button onClick={saveClassesToDb} disabled={isSaving} className="animate-bounce bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-8 py-3 rounded-full font-bold shadow-[0_0_20px_rgba(99,102,241,0.5)] hover:shadow-[0_0_30px_rgba(99,102,241,0.8)] transition-all flex items-center gap-2 border border-white/20">
                                    <SaveIcon size={18} /> {isSaving ? 'Menyimpan...' : 'SIMPAN PERUBAHAN'}
                                </button>
                            )}
                        </div>

                        <div className="space-y-4">
                        {standardClasses.map((row, i) => (
                            <div key={i} className="grid grid-cols-5 gap-3 md:gap-4">
                            {row.map(nm => {
                                const dbClass = data.classes.find(c => c.name === nm);
                                let dbStatus = false;
                                if (dbClass) {
                                    const relation = data.teacher_classes?.find(tc => tc.teacherId === authUser.id && tc.classId === dbClass.id);
                                    dbStatus = relation ? relation.isActive : false;
                                }
                                const isActive = pendingChanges[nm] !== undefined ? pendingChanges[nm] : dbStatus;
                                const isDirty = pendingChanges[nm] !== undefined;
                                return (
                                <button key={nm} onClick={() => toggleClassManual(nm)} 
                                    className={`
                                        h-16 rounded-xl font-black text-xl transition-all relative border overflow-hidden group z-10
                                        ${isActive 
                                            ? 'bg-indigo-600/20 border-indigo-500/50 text-indigo-100 shadow-[0_0_15px_rgba(99,102,241,0.3)] hover:bg-indigo-600 hover:border-indigo-400' 
                                            : 'bg-slate-900/50 border-white/5 text-slate-600 hover:border-white/20 hover:text-slate-400'}
                                        ${isDirty ? 'ring-2 ring-yellow-500/50 ring-offset-2 ring-offset-slate-900' : ''}
                                    `}
                                >
                                    <span className="relative z-10 pointer-events-none">{nm}</span>
                                    {isActive && <div className="absolute inset-0 bg-gradient-to-t from-indigo-600/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity -z-10"></div>}
                                    {isDirty && <div className="absolute top-2 right-2 w-2 h-2 bg-yellow-500 rounded-full shadow-[0_0_10px_rgba(234,179,8,0.8)] animate-pulse"></div>}
                                </button>
                                )
                            })}
                            </div>
                        ))}
                        </div>
                    </div>
                </div>
            );
        }

        // --- CLASSES VIEW ---
        function ClassesView({ data, activeClasses, showConfirm, authUser }) {
            const [selectedClassId, setSelectedClassId] = useState(activeClasses[0]?.id || '');
            const [newStudentName, setNewStudentName] = useState('');

            const classStudents = data.students.filter(s => s.classId === selectedClassId);

            const handleAddStudent = async (e) => {
                e.preventDefault();
                if(!newStudentName.trim() || !selectedClassId) return;
                await addDoc(collection(db, 'students'), { name: newStudentName.trim(), classId: selectedClassId, createdAt: Date.now() });
                setNewStudentName('');
            };

            const handleDeleteStudent = (id) => {
                showConfirm('Yakin ingin menghapus siswa ini?', async () => {
                    await deleteDoc(doc(db, 'students', id));
                });
            };

            return (
                <div className="space-y-6 animate-in fade-in">
                    <div className="flex justify-between items-center border-b border-white/5 pb-6">
                        <div>
                            <h2 className="text-3xl font-bold text-white tracking-tight">Manajemen Kelas</h2>
                            <p className="text-slate-400 mt-1">Daftar siswa ini dibagikan ke semua guru secara sinkron.</p>
                        </div>
                    </div>

                    <div className="flex gap-4 overflow-x-auto pb-4 custom-scrollbar">
                        {activeClasses.map(c => (
                            <button key={c.id} onClick={() => setSelectedClassId(c.id)}
                                className={`px-6 py-3 rounded-xl font-bold border transition-all flex-shrink-0 z-10 relative ${selectedClassId === c.id ? 'bg-indigo-600/20 border-indigo-500 text-white' : 'bg-slate-900/50 border-white/10 text-slate-400 hover:bg-slate-800'}`}>
                                <span className="pointer-events-none">{c.name}</span>
                            </button>
                        ))}
                        {activeClasses.length === 0 && <p className="text-slate-500">Belum ada kelas aktif. Silakan aktifkan di Dashboard.</p>}
                    </div>

                    {selectedClassId && (
                        <div className="bg-slate-900/60 border border-white/10 rounded-2xl p-6 backdrop-blur-md">
                            {authUser?.isAdmin ? (
                                <form onSubmit={handleAddStudent} className="flex gap-3 mb-6 animate-in fade-in">
                                    <input type="text" value={newStudentName} onChange={e => setNewStudentName(e.target.value)} placeholder="Nama Siswa Baru..." className="flex-1 bg-slate-950 border border-white/10 px-4 py-3 rounded-xl text-white outline-none focus:border-indigo-500" />
                                    <button type="submit" className="bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-indigo-500 flex items-center gap-2"><Plus size={18}/> Tambah</button>
                                </form>
                            ) : (
                                <div className="p-4 bg-slate-950/40 border border-white/5 rounded-xl text-xs text-slate-400 mb-6 flex items-center gap-2">
                                    <Lock size={14} className="text-indigo-400" />
                                    <span>Menu tambah atau hapus siswa dinonaktifkan. Manajemen siswa dikunci oleh Admin Sekolah (Bpk. Gagat).</span>
                                </div>
                            )}

                            <div className="space-y-2 max-h-[500px] overflow-y-auto custom-scrollbar pr-2">
                                {classStudents.map((s, idx) => (
                                    <div key={s.id} className="flex justify-between items-center bg-slate-950/50 border border-white/5 p-4 rounded-xl hover:bg-slate-900 transition-colors">
                                        <div className="flex gap-4 items-center">
                                            <span className="text-slate-500 font-mono w-6 text-right">{idx + 1}.</span>
                                            <span className="text-slate-200 font-medium">{s.name}</span>
                                        </div>
                                        {authUser?.isAdmin && (
                                            <button onClick={() => handleDeleteStudent(s.id)} className="text-red-400/50 hover:text-red-400 p-2"><Trash2 size={18}/></button>
                                        )}
                                    </div>
                                ))}
                                {classStudents.length === 0 && <p className="text-slate-500 text-center py-8">Belum ada siswa di kelas ini.</p>}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- ASSESSMENTS VIEW ---
        function AssessmentsView({ data, authUser, showConfirm }) {
            const [title, setTitle] = useState('');
            const [desc, setDesc] = useState('');
            const [weight, setWeight] = useState(1); 
            const [activeGrade, setActiveGrade] = useState('9');

            const [editingId, setEditingId] = useState(null);
            const [editForm, setEditForm] = useState({ title: '', desc: '', weight: 1 });

            // FILTER: Hanya tampilkan materi milik guru yang sedang login & sesuai jenjang terpilih
            const myFilteredAssessments = useMemo(() => {
                return data.assessments.filter(a => {
                    const parts = a.id.split('-');
                    const aTeacherId = parts.length === 3 ? parts[1] : 'gagat';
                    const aGrade = parts.length === 3 ? parts[2] : '9';
                    
                    return aTeacherId === authUser.id && aGrade === String(activeGrade);
                });
            }, [data.assessments, authUser.id, activeGrade]);

            const handleAdd = async (e) => {
                e.preventDefault();
                if(!title.trim()) return;
                await addDoc(collection(db, 'assessments'), { 
                    _customId: generateId() + '-' + authUser.id + '-' + activeGrade,
                    title: title.trim(), 
                    assessment_title: title.trim(), // Jaga-jaga untuk kolom gembok Supabase versi lama
                    teacher_id: authUser.id, // Memastikan data kepemilikan guru tidak ditolak Supabase
                    description: desc.trim(), 
                    weight: Number(weight), 
                    createdAt: Date.now() 
                });
                setTitle(''); setDesc(''); setWeight(1);
            };

            const startEdit = (a) => {

                    <div className="grid md:grid-cols-3 gap-6">

        // --- INPUT MATRIX VIEW ---
        function InputMatrixView({ data, authUser, activeClasses, showMessage }) {
            const [selectedClassId, setSelectedClassId] = useState(activeClasses[0]?.id || '');
            const [localGrades, setLocalGrades] = useState({});
            
            const [isSavingBatch, setIsSavingBatch] = useState(false);
            const [batchProgress, setBatchProgress] = useState('');

            // FILTER: Matriks menyesuaikan tugas dengan jenjang kelas yang dipilih
            const myFilteredAssessments = useMemo(() => {
                const activeClassObj = activeClasses.find(c => c.id === selectedClassId);
                const targetGrade = activeClassObj ? activeClassObj.name.charAt(0) : '9';
                
                return data.assessments.filter(a => {
                    const parts = a.id.split('-');
                    const aTeacherId = parts.length === 3 ? parts[1] : 'gagat';
                    const aGrade = parts.length === 3 ? parts[2] : '9';
                    
                    return aTeacherId === authUser.id && aGrade === String(targetGrade);
                });
            }, [data.assessments, authUser.id, activeClasses, selectedClassId]);

            const classStudents = data.students.filter(s => s.classId === selectedClassId);

            useEffect(() => {
                const currentGrades = {};
                classStudents.forEach(s => {
                    myFilteredAssessments.forEach(a => {
                        const key = `${s.id}_${a.id}`;
                        if(data.grades[key] !== undefined) currentGrades[key] = data.grades[key];
                    });
                });
                setLocalGrades(currentGrades);
            }, [selectedClassId, data.grades, myFilteredAssessments, classStudents.length]);

            const handleGradeChange = (studentId, assId, val) => {
                setLocalGrades(prev => ({ ...prev, [`${studentId}_${assId}`]: val }));
            };

            const handleSave = async (studentId, assId) => {
                const score = localGrades[`${studentId}_${assId}`];
                if(score === undefined || score === '') return;
                const id = `${studentId}_${assId}`;
                await setDoc(doc(db, 'grades', id), { studentId, assessmentId: assId, score: Number(score), updatedAt: Date.now() });
            };

            const calculateNA = (studentId) => {
                let totalWeightedScore = 0;
                let totalWeight = 0;
                let hasScores = false;

                myFilteredAssessments.forEach(a => {
                    const globalScore = data.grades[`${studentId}_${a.id}`];
                    const localScore = localGrades[`${studentId}_${a.id}`];
                    const scoreToUse = localScore !== undefined && localScore !== '' ? Number(localScore) : globalScore;
                    
                    if(scoreToUse !== undefined) {
                        const w = Number(a.weight) || 1;
                        totalWeightedScore += (scoreToUse * w);
                        totalWeight += w;
                        hasScores = true;
                    }
                });

                if(!hasScores || totalWeight === 0) return '-';
                return Math.round(totalWeightedScore / totalWeight);
            };

            // LOGIKA SMART PASTE MULTI-BARIS
            const handlePasteToTable = async (e, startRowIdx, targetAssId) => {
                const pasteData = e.clipboardData.getData('text');
                if (!pasteData) return;

                const lines = pasteData.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
                
                if (lines.length > 1) {
                    e.preventDefault(); 
                    
                    const newGrades = { ...localGrades };
                    const updatesToSave = [];

                    let valIndex = 0;
                    for (let i = startRowIdx; i < classStudents.length && valIndex < lines.length; i++) {
                        const valStr = lines[valIndex].trim().replace(',', '.');
                        if (valStr !== '') {
                            const val = parseFloat(valStr);
                            if (!isNaN(val) && val >= 0 && val <= 100) {
                                const student = classStudents[i];
                                newGrades[`${student.id}_${targetAssId}`] = val;
                                updatesToSave.push({ studentId: student.id, val });
                            }
                        }
                        valIndex++;
                    }

                    setLocalGrades(newGrades);

                    if (updatesToSave.length > 0) {
                        setIsSavingBatch(true);
                        let count = 0;
                        for (const item of updatesToSave) {
                            const id = `${item.studentId}_${targetAssId}`;
                            await setDoc(doc(db, 'grades', id), { studentId: item.studentId, assessmentId: targetAssId, score: item.val, updatedAt: Date.now() });
                            count++;
                            setBatchProgress(`Menyimpan ${count} / ${updatesToSave.length} nilai...`); 
                            await new Promise(resolve => setTimeout(resolve, 350));
                        }
                        setIsSavingBatch(false);
                        setBatchProgress('');
                        showMessage(`Paste cerdas berhasil! ${count} nilai telah tersimpan ke database.`, "Sukses");
                    }
                }
            };

            return (
                <div className="space-y-6 animate-in fade-in relative">
                    {isSavingBatch && (
                        <div className="fixed inset-0 z-[60] bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-indigo-500/50 p-8 rounded-2xl flex flex-col items-center shadow-[0_0_50px_rgba(99,102,241,0.2)]">
                                <div className="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-indigo-500 mb-4"></div>
                                <h3 className="text-xl font-bold text-white tracking-tight">Memproses Paste Cerdas...</h3>
                                <p className="text-emerald-400 mt-2 font-mono text-sm font-bold">{batchProgress}</p>
                                <p className="text-slate-400 text-xs mt-2">Mohon jangan tutup halaman ini.</p>
                            </div>
                        </div>
                    )}

                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-white/5 pb-6 gap-4">
                        <div>
                            <h2 className="text-3xl font-bold text-white tracking-tight">Input Nilai Matrix</h2>
                            <p className="text-slate-400 mt-1">Blok nilai di Excel, klik di sel pertama, lalu tekan <b>Ctrl+V</b>.</p>
                        </div>
                    </div>

                    <div className="flex gap-4 overflow-x-auto pb-4 custom-scrollbar">
                        {activeClasses.map(c => (
                            <button key={c.id} onClick={() => setSelectedClassId(c.id)}
                                className={`px-6 py-3 rounded-xl font-bold border transition-all flex-shrink-0 z-10 relative ${selectedClassId === c.id ? 'bg-indigo-600/20 border-indigo-500 text-white' : 'bg-slate-900/50 border-white/10 text-slate-400 hover:bg-slate-800'}`}>
                                <span className="pointer-events-none">{c.name}</span>
                            </button>
                        ))}
                    </div>

                    {selectedClassId ? (
                        <div className="bg-[#0b1126] border border-white/10 rounded-2xl overflow-x-auto custom-scrollbar p-1 shadow-2xl relative">
                            <table className="w-full text-left border-collapse min-w-max">
                                <thead className="bg-slate-950">
                                    <tr>
                                        <th className="p-2 md:p-4 text-slate-400 font-bold text-[10px] md:text-xs uppercase tracking-wider border-b border-white/10 w-8 md:w-12 text-center shrink-0">No</th>
                                        <th className="p-2 md:p-4 text-slate-400 font-bold text-[10px] md:text-xs uppercase tracking-wider border-b border-white/10 sticky left-0 bg-slate-950 z-10 min-w-[110px] max-w-[120px] md:min-w-[200px] md:max-w-max border-r shadow-[2px_0_5px_-2px_rgba(0,0,0,0.5)]">Nama Siswa</th>
                                        {myFilteredAssessments.map(a => (
                                            <th key={a.id} className="p-2 md:p-4 text-slate-400 font-bold text-[10px] md:text-xs uppercase tracking-wider border-b border-white/10 text-center min-w-[80px] md:min-w-[120px]">
                                                <div className="truncate w-full" title={a.title}>{a.title}</div>
                                                <span className="text-[9px] md:text-[10px] text-emerald-400 bg-emerald-500/10 px-1.5 py-0.5 rounded mt-1 inline-block">W: {a.weight||1}</span>
                                            </th>
                                        ))}
                                        <th className="p-2 md:p-4 text-indigo-400 font-bold text-[10px] md:text-xs uppercase tracking-wider border-b border-white/10 text-center bg-indigo-500/5 min-w-[60px] md:min-w-[80px]">NA</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {classStudents.map((s, idx) => {
                                        const naVal = calculateNA(s.id);
                                        const naColor = naVal !== '-' && naVal < 70 ? 'text-red-400' : 'text-indigo-400';
                                        
                                        return (
                                        <tr key={s.id} className="border-b border-white/5 hover:bg-slate-800/50 transition-colors">
                                            <td className="p-2 md:p-4 text-slate-500 font-mono text-xs md:text-sm text-center">{idx + 1}</td>
                                            <td className="p-2 md:p-4 text-slate-200 font-medium text-xs md:text-sm whitespace-normal break-words leading-tight sticky left-0 bg-[#0b1126] z-10 border-r border-white/5 min-w-[110px] max-w-[120px] md:min-w-[200px] md:max-w-max shadow-[2px_0_5px_-2px_rgba(0,0,0,0.5)]">{s.name}</td>
                                            {myFilteredAssessments.map(a => {
                                                const globalScore = data.grades[`${s.id}_${a.id}`];
                                                const localScore = localGrades[`${s.id}_${a.id}`];
                                                const isUnsaved = localScore !== undefined && localScore !== '' && Number(localScore) !== Number(globalScore);
                                                
                                                return (
                                                <td key={a.id} className="p-1 md:p-2 text-center relative group">
                                                    <input 
                                                        type="number" min="0" max="100" 
                                                        value={localScore !== undefined ? localScore : ''} 
                                                        onChange={e => handleGradeChange(s.id, a.id, e.target.value)}
                                                        onBlur={() => handleSave(s.id, a.id)}
                                                        onPaste={(e) => handlePasteToTable(e, idx, a.id)}
                                                        className={`w-full bg-transparent border-b-2 px-1 py-2 md:px-2 text-center font-bold text-sm md:text-base outline-none transition-all placeholder:text-slate-700
                                                            ${isUnsaved ? 'border-yellow-500 text-yellow-400 bg-yellow-500/5' : 'border-transparent text-white focus:border-indigo-500 hover:border-white/20 focus:bg-indigo-500/10'}
                                                            ${localScore !== undefined && Number(localScore) < 70 ? '!text-red-400' : ''}
                                                        `}
                                                        placeholder="-"
                                                    />
                                                    {isUnsaved && <div className="absolute top-1 right-1 w-1.5 h-1.5 bg-yellow-500 rounded-full animate-pulse"></div>}
                                                </td>
                                                )
                                            })}
                                            <td className={`p-2 md:p-4 text-center font-black font-mono bg-indigo-500/5 text-sm md:text-lg ${naColor}`}>{naVal}</td>
                                        </tr>
                                    )})}
                                </tbody>
                            </table>
                            {classStudents.length === 0 && <div className="p-8 text-center text-slate-500">Siswa kosong di kelas ini.</div>}
                        </div>
                    ) : (
                        <div className="text-slate-500 text-center py-8">Pilih kelas terlebih dahulu.</div>
                    )}
                </div>
            );
        }

        // --- RECAP VIEW (GABUNGAN LAPORAN & KONVERSI DENGAN JENJANG/PARALEL) ---
        function RecapView({ data, authUser, activeClasses, showMessage }) {
            const [viewMode, setViewMode] = useState('class'); // 'class' atau 'jenjang'
            const [selectedClassId, setSelectedClassId] = useState(activeClasses[0]?.id || '');
            const [selectedJenjang, setSelectedJenjang] = useState('9'); // Default kelas 9
            
            const [targetMin, setTargetMin] = useState(() => getTeacherKkm(authUser.id).targetMin);
            const [targetMax, setTargetMax] = useState(() => getTeacherKkm(authUser.id).targetMax);

            useEffect(() => {
                const saved = getTeacherKkm(authUser.id);
                setTargetMin(saved.targetMin);
                setTargetMax(saved.targetMax);
            }, [authUser.id]);

            const handleKkmChange = (field, value) => {
                const nextMin = field === 'min' ? Number(value) || 0 : targetMin;
                const nextMax = field === 'max' ? Number(value) || nextMin : targetMax;
                const safeMin = Math.min(nextMin, nextMax);
                const safeMax = Math.max(nextMin, nextMax);

                setTargetMin(safeMin);
                setTargetMax(safeMax);
                saveTeacherKkm(authUser.id, { targetMin: safeMin, targetMax: safeMax });
            };

            // FILTER: Tabel rekap menyesuaikan materi dengan jenjang yang dipilih
            const myFilteredAssessments = useMemo(() => {
                const targetGrade = viewMode === 'class' 
                    ? (activeClasses.find(c => c.id === selectedClassId)?.name.charAt(0) || '9') 
                    : selectedJenjang;
                    
                return data.assessments.filter(a => {
                    const parts = a.id.split('-');
                    const aTeacherId = parts.length === 3 ? parts[1] : 'gagat';
                    const aGrade = parts.length === 3 ? parts[2] : '9';
                    
                    return aTeacherId === authUser.id && aGrade === String(targetGrade);
                });
            }, [data.assessments, authUser.id, activeClasses, selectedClassId, selectedJenjang, viewMode]);

            // Tentukan siswa mana yang ditampilkan berdasarkan mode
            const displayedStudents = useMemo(() => {
                if (viewMode === 'class') {
                    return data.students.filter(s => s.classId === selectedClassId);
                } else {
                    const validClassIds = activeClasses.filter(c => c.name.startsWith(selectedJenjang)).map(c => c.id);
                    return data.students.filter(s => validClassIds.includes(s.classId));
                }
            }, [data.students, activeClasses, selectedClassId, selectedJenjang, viewMode]);

            // Hitung nilai asli (original) dengan pembobotan
            const getOriginalScore = (studentId) => {
                let totalWeightedScore = 0;
                let totalWeight = 0;
                let hasScores = false;
                myFilteredAssessments.forEach(a => {
                    const score = data.grades[`${studentId}_${a.id}`];
                    if(score !== undefined) {
                        const w = Number(a.weight) || 1;
                        totalWeightedScore += (score * w);
                        totalWeight += w;
                        hasScores = true;
                    }
                });
                return hasScores && totalWeight > 0 ? (totalWeightedScore / totalWeight) : null;
            };

            // Tambahkan properti originalScore ke setiap siswa
            const studentsWithOriginal = useMemo(() => {
                return displayedStudents.map(s => ({ ...s, originalScore: getOriginalScore(s.id) }));
            }, [displayedStudents, data.grades, myFilteredAssessments]);

            // Cari nilai Min & Max Aktual berdasarkan skup (kelas/jenjang)
            const { actualMin, actualMax } = useMemo(() => {
                const validScores = studentsWithOriginal.map(s => s.originalScore).filter(val => val !== null);
                if (validScores.length === 0) return { actualMin: 0, actualMax: 0 };
                return {
                    actualMin: Math.min(...validScores),
                    actualMax: Math.max(...validScores)
                };
            }, [studentsWithOriginal]);

            // Rumus Konversi
            const convertScore = (original) => {
                if (original === null) return null;
                if (actualMax === actualMin) return Number(targetMax); 
                const ratio = (original - actualMin) / (actualMax - actualMin);
                const converted = Number(targetMin) + (ratio * (Number(targetMax) - Number(targetMin)));
                return Math.round(converted); // Dibulatkan agar bersih
            };

            const handleDownloadCSV = () => {
                let fileName = 'Rekap_Nilai.csv';
                let classLabel = '';
                
                if (viewMode === 'class') {
                    const cClass = activeClasses.find(c => c.id === selectedClassId);
                    if (cClass) {
                        fileName = `Rekap_Nilai_Kelas_${cClass.name}.csv`;
                        classLabel = cClass.name;
                    }
                } else {
                    fileName = `Rekap_Nilai_Paralel_Kelas_${selectedJenjang}.csv`;
                    classLabel = `PARALEL KELAS ${selectedJenjang}`;
                }

                let csvPrefix = `"MATA PELAJARAN","${authUser.subject.toUpperCase()}"\r\n`;
                csvPrefix += `"GURU PENGAJAR","${authUser.name.toUpperCase()}"\r\n`;
                csvPrefix += `"KELAS","${classLabel.toUpperCase()}"\r\n\r\n`;

                let headers = ["No"];
                if (viewMode === 'jenjang') headers.push("Kelas");
                headers.push("Nama Siswa");
                
                myFilteredAssessments.forEach(a => {
                    headers.push(`${a.title} (Bobot: ${a.weight||1})`);
                });
                headers.push("Rata-rata Asli");
                headers.push("Nilai Konversi");

                let csvContent = csvPrefix + headers.map(h => `"${h}"`).join(",") + "\r\n";

                studentsWithOriginal.forEach((s, idx) => {
                    let rowData = [];
                    rowData.push(idx + 1);
                    
                    if (viewMode === 'jenjang') {
                        const clsName = activeClasses.find(c => c.id === s.classId)?.name || '-';
                        rowData.push(`"${clsName}"`);
                    }

                    rowData.push(`"${s.name}"`);
                    
                    myFilteredAssessments.forEach(a => {
                        const score = data.grades[`${s.id}_${a.id}`];
                        rowData.push(score !== undefined ? score : '');
                    });

                    const finalScore = convertScore(s.originalScore);
                    const originalScoreStr = s.originalScore !== null ? s.originalScore.toFixed(1) : '';
                    const finalScoreStr = finalScore !== null ? finalScore : '';

                    rowData.push(originalScoreStr);
                    rowData.push(finalScoreStr);
                    
                    csvContent += rowData.join(",") + "\r\n";
                });

                const blob = new Blob(["\ufeff" + csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", fileName);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (

        // --- SETTINGS VIEW (KHUSUS ADMIN) ---
        function SettingsView({ authUser, data, showMessage, showConfirm }) {

            const [txt, setTxt] = useState('');
            const [isSaving, setIsSaving] = useState(false);

            if (!authUser.isAdmin) {
                return (
                    <div className="flex flex-col items-center justify-center h-[60vh] text-center animate-in fade-in zoom-in duration-300">

                        <h2 className="text-3xl font-black text-white mb-2 tracking-tight">Akses Terkunci</h2>

                    </div>
                );
            }

            const handleResetLocalData = () => {
                showConfirm("Hapus semua data lokal yang tersimpan di browser ini?", () => {
                    localStorage.removeItem('seru_local_app_data_v1');
                    showMessage("Data lokal berhasil dibersihkan. Halaman akan dimuat ulang.", "Reset Selesai");
                    setTimeout(() => window.location.reload(), 1000);
                });
            };

            const handleImport = async () => {
                if (!txt.trim()) return;
                setIsSaving(true);
                try {
                    const textToParse = txt.replace(/\n/g, ' '); 
                    const regex = /(.+?)([789][A-Za-z])/gi;
                    let match;
                    const studentsToAdd = [];
                    
                    while ((match = regex.exec(textToParse)) !== null) {
                        let studentName = match[1].trim();
                        let classNameRaw = match[2].toUpperCase().trim();
                        studentName = studentName.replace(/^[0-9.\-\s]+/, '').trim();
                        if (studentName && classNameRaw) {
                            studentsToAdd.push({ name: studentName, className: classNameRaw });
                        }
                    }

                    if (studentsToAdd.length === 0) {
                        const lines = txt.split('\n');
                        for (let line of lines) {
                            line = line.trim();
                            if (!line || line.toLowerCase().startsWith('nama')) continue;
                            let studentName = '';
                            let classNameRaw = '';
                            
                            if (line.includes(',') || line.includes('\t')) {
                                const parts = line.split(/[,\t]/);
                                if (parts.length >= 2) {
                                    studentName = parts[0].trim();
                                    classNameRaw = parts[parts.length-1].trim(); 
                                }
                            } else {
                                const lastSpaceIndex = line.lastIndexOf(' ');
                                if (lastSpaceIndex !== -1) {
                                    studentName = line.substring(0, lastSpaceIndex).trim();
                                    classNameRaw = line.substring(lastSpaceIndex).trim();
                                }
                            }

                            if (!studentName || !classNameRaw) continue;
                            studentName = studentName.replace(/^[0-9.\-\s]+/, '').trim();
                            if(studentName) {
                                studentsToAdd.push({ name: studentName, className: classNameRaw.toUpperCase() });
                            }
                        }
                    }

                    if (studentsToAdd.length === 0) {
                        showMessage("Gagal membaca format! Pastikan ada format Nama dan Kelas (Angka & Huruf).", "Error");
                        setIsSaving(false);
                        return;
                    }

                    let count = 0;
                    const localClassesRef = [...data.classes]; 
                    const localStudentsTrack = new Set(data.students.map(s => `${s.name.toUpperCase()}_${s.classId}`));

                    for (const s of studentsToAdd) {
                        const targetClassName = s.className;
                        let targetClass = localClassesRef.find(c => c.name.toUpperCase() === targetClassName);
                        let classId = targetClass?.id;
                        
                        if (!targetClass) {
                            const newClassRef = await addDoc(collection(db, 'classes'), { name: targetClassName, isActive: true, createdAt: Date.now() });
                            classId = newClassRef.id;
                            localClassesRef.push({ id: classId, name: targetClassName, isActive: true });
                            await new Promise(resolve => setTimeout(resolve, 300)); 
                        } else if (targetClass.isActive === false) {
                            await updateDoc(doc(db, 'classes', classId), { isActive: true });
                            targetClass.isActive = true;
                            await new Promise(resolve => setTimeout(resolve, 300));
                        }
                        
                        const studentKey = `${s.name.toUpperCase()}_${classId}`;
                        
                        if (!localStudentsTrack.has(studentKey)) {
                            await addDoc(collection(db, 'students'), { name: s.name, classId, createdAt: Date.now() });
                            localStudentsTrack.add(studentKey);
                            count++;
                            
                            setTxt(`MEMPROSES PENYIMPANAN LOKAL...\nSedang menyimpan: ${count} dari ${studentsToAdd.length} siswa.\n\nData ini disimpan di browser Anda, bukan di sheet atau firebase...`);
                            await new Promise(resolve => setTimeout(resolve, 350));
                        }
                    }
                    
                    showMessage(`Import ${count} siswa berhasil disimpan ke database!`, "Sukses"); 
                    setTxt(''); 
                    setShowImport(false);
                } catch (e) {
                    showMessage("Terjadi kesalahan import: " + e.message, "Error");
                } finally {
                    setIsSaving(false);
                }
            };

           return (
                <div className="max-w-4xl mx-auto space-y-6 animate-in fade-in pt-8">

                    {/* BLOK BARU: PUSAT PINTASAN INTEGRASI KONSOL PROJEK */}
                    <div className="bg-[#0b1126]/90 border border-white/10 rounded-2xl p-6 backdrop-blur-md relative overflow-hidden shadow-2xl">
                        <div className="absolute top-0 right-0 p-24 opacity-5 bg-gradient-to-br from-indigo-500 to-purple-500 blur-2xl"></div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <a href="https://github.com/gagataditya-create/DAFTAR-NILAI-APP" target="_blank" rel="noopener noreferrer" className="flex items-center justify-between p-3.5 bg-slate-950/60 border border-white/5 rounded-xl hover:border-indigo-500/50 hover:bg-slate-900/50 transition-all group">
                                <span className="text-xs font-bold text-slate-300 group-hover:text-white">GitHub Daftar Nilai APP</span>
                                <span className="text-[11px] text-indigo-400 font-mono font-bold">Buka Konsol &rarr;</span>
                            </a>
                            <a href="https://dash.cloudflare.com/c22ee62db8d5e590a81eca9ca715de93/workers/services/view/daftarnilaispenday/production" target="_blank" rel="noopener noreferrer" className="flex items-center justify-between p-3.5 bg-slate-950/60 border border-white/5 rounded-xl hover:border-indigo-500/50 hover:bg-slate-900/50 transition-all group">
                                <span className="text-xs font-bold text-slate-300 group-hover:text-white">Cloudflare Worker Dasbor</span>
                                <span className="text-[11px] text-indigo-400 font-mono font-bold">Buka Konsol &rarr;</span>
                            </a>
                            <a href="https://daftarnilaispenday.gagataditya94.workers.dev/" target="_blank" rel="noopener noreferrer" className="flex items-center justify-between p-3.5 bg-slate-950/60 border border-white/5 rounded-xl hover:border-indigo-500/50 hover:bg-slate-900/50 transition-all group">
                                <span className="text-xs font-bold text-slate-300 group-hover:text-white">Alamat URL Aplikasi Live</span>
                                <span className="text-[11px] text-indigo-400 font-mono font-bold">Buka Link &rarr;</span>
                            </a>
                            <a href="https://supabase.com/dashboard/project/qtnmvphffxfnwgbkhtwh/sql/b6389541-c37d-4beb-b6fd-85ef709e181b" target="_blank" rel="noopener noreferrer" className="flex items-center justify-between p-3.5 bg-slate-950/60 border border-white/5 rounded-xl hover:border-indigo-500/50 hover:bg-slate-900/50 transition-all group">
                                <span className="text-xs font-bold text-slate-300 group-hover:text-white">Supabase SQL Dashboard</span>
                                <span className="text-[11px] text-indigo-400 font-mono font-bold">Buka Gudang &rarr;</span>
                            </a>
                            <a href="https://gemini.google.com/u/1/app/9b4cd816fc61b2a3?pageId=none" target="_blank" rel="noopener noreferrer" className="flex items-center justify-between p-3.5 bg-slate-950/60 border border-white/5 rounded-xl hover:border-indigo-500/50 hover:bg-slate-900/50 transition-all group">
                                <span className="text-xs font-bold text-slate-300 group-hover:text-white">Gemini Pandu AI Collaborator</span>
                                <span className="text-[11px] text-indigo-400 font-mono font-bold">Buka Chat &rarr;</span>
                            </a>
                            <a href="https://docs.google.com/spreadsheets/d/1X7zPzMKXceFxW3PsjIu16lj2JhauZcGPU_JaWmADyYs/edit?gid=1540998902#gid=1540998902" target="_blank" rel="noopener noreferrer" className="flex items-center justify-between p-3.5 bg-slate-950/60 border border-white/5 rounded-xl hover:border-indigo-500/50 hover:bg-slate-900/50 transition-all group">
                                <span className="text-xs font-bold text-slate-300 group-hover:text-white">Google Sheet Master Data</span>
                                <span className="text-[11px] text-indigo-400 font-mono font-bold">Buka Sheet &rarr;</span>
                            </a>
                        </div>
                    </div>

                    <div className="grid md:grid-cols-2 gap-6">
                        <div className="bg-slate-900/60 border border-white/10 rounded-2xl p-6 backdrop-blur-md space-y-4">
                            <h3 className="font-bold text-white text-lg flex items-center gap-2 mb-4"><Sliders size={20} className="text-indigo-400"/> Manajemen Database</h3>
                            
                            <div className="bg-indigo-500/10 border border-indigo-500/20 p-4 rounded-xl text-sm text-indigo-200">
                                Pembersihan penyimpanan lokal digunakan apabila browser Anda menolak memuat data terbaru atau mengalami crash akibat memori usang.
                            </div>

                            <button onClick={handleResetLocalData} className="w-full bg-slate-800 border border-white/10 text-slate-300 py-3 rounded-xl font-bold flex justify-center items-center gap-2 hover:bg-slate-700 hover:text-white transition-all">
                                <Trash2 size={18} /> BERSIHKAN MEMORI LOKAL BROWSER
                            </button>
                        </div>

                        <div className="bg-slate-900/60 border border-white/10 rounded-2xl p-6 backdrop-blur-md space-y-4">
                            <h3 className="font-bold text-white text-lg flex items-center gap-2 mb-4"><Users size={20} className="text-emerald-400"/> Master Data Siswa</h3>
                            
                            <div className="bg-emerald-500/10 border border-emerald-500/20 p-4 rounded-xl text-sm text-emerald-200">
                                Perbarui atau tambahkan database siswa seluruh kelas secara massal dari sini. Data otomatis tersinkronisasi realtime ke semua portal guru.
                            </div>

                            <button onClick={() => setShowImport(true)} className="w-full mt-4 bg-emerald-600/20 border border-emerald-500/50 text-emerald-400 py-4 rounded-xl font-bold flex justify-center items-center gap-3 hover:bg-emerald-600 hover:text-white transition-all shadow-[0_0_20px_rgba(16,185,129,0.2)]">
                                <Clipboard size={22} /> PORTAL IMPORT EXCEL DATA SISWA
                            </button>
                        </div>
                    </div>

                    {/* MODAL IMPORT */}
                    {showImport && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center z-[90] p-4">
                        <div className="bg-slate-900 border border-white/10 rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh] animate-in zoom-in-95 duration-200">
                            <div className="p-6 border-b border-white/10 flex justify-between items-center bg-white/5">
                                <h3 className="font-bold text-white text-lg flex items-center gap-2"><Clipboard className="text-emerald-400"/> Paste Data Excel</h3>
                                <button onClick={() => setShowImport(false)} className="text-slate-400 hover:text-white"><X/></button>
                            </div>
                            <div className="p-6 flex-1 overflow-auto">
                            <div className="bg-emerald-500/10 border border-emerald-500/20 p-4 rounded-xl text-xs text-emerald-300 mb-4 font-mono">
                                Tempelkan data seluruh siswa di sini!<br/>Contoh: <strong>BUDI 9AANDI 9B</strong>
                            </div>
                            <textarea value={txt} onChange={e => setTxt(e.target.value)} className="w-full h-64 p-4 bg-slate-950 border border-white/10 rounded-xl font-mono text-sm text-slate-300 focus:ring-2 focus:ring-emerald-500 outline-none custom-scrollbar" placeholder="Paste data siswa disini..."></textarea>
                            </div>
                            <div className="p-6 border-t border-white/10 bg-white/5 flex justify-end gap-3">
                            <button onClick={handleImport} disabled={isSaving} className="bg-emerald-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-emerald-500 shadow-lg transition-all disabled:opacity-50">
                                {isSaving ? 'MEMPROSES...' : 'PROSES DATA'}
                            </button>
                            </div>
                        </div>
                        </div>
                    )}
                </div>
            );
        }

        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<ArtGradesApp />);
        } catch (error) {
            if (window.__showFatalError) {
                window.__showFatalError(error);
            }
        }
    </script>
</body>
